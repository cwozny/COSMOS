# Runs vendor/installers/windows/INSTALL_COSMOS.bat on a clean Windows runner
# and then starts two COSMOS tools from what it installed. It downloads and
# builds everything, which takes a while, so only changes to the installer (or
# this file) run it: pushes to cosmos4-qt6, and pull requests into it, where
# every update of such a pull request runs it on the PR's own code. The
# checkout is what gets installed.

name: Windows Installer

on:
  push:
    branches: [cosmos4-qt6]
    paths:
      - "vendor/installers/windows/**"
      - ".github/workflows/windows_installer.yml"
  pull_request:
    branches: [cosmos4-qt6]
    paths:
      - "vendor/installers/windows/**"
      - ".github/workflows/windows_installer.yml"
  workflow_dispatch:

jobs:
  install:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v2
      - name: Hide the runner's MSYS2
        # Ruby falls back to C:\msys64 when the MSYS2 next to it is missing,
        # which would let the install pass without the one it set up.
        shell: pwsh
        run: Rename-Item C:\msys64 msys64-runner
      - name: Run INSTALL_COSMOS.bat
        shell: cmd
        # NUL answers the installer's prompts (pause, set /p) with nothing.
        run: |
          call vendor\installers\windows\INSTALL_COSMOS.bat C:\COSMOS < NUL
          if errorlevel 1 exit /b 1
      - name: Show INSTALL.log
        if: always()
        shell: cmd
        run: type C:\COSMOS\INSTALL.log
      - name: Start COSMOS tools from the install
        shell: cmd
        env:
          QT_QPA_PLATFORM: offscreen
          COSMOS_USERPATH: C:\COSMOS\Demo
          # The Demo's tools run under its Gemfile (tool_launch.rb requires
          # bundler/setup first). tool_smoke.rb's stand-in Gemfile instead
          # has Bundler resolve after the tool redirects its output, and
          # "Resolving dependencies..." then opens a dialog.
          BUNDLE_GEMFILE: C:\COSMOS\Demo\Gemfile
        # Not the Launcher: it opens the modal Legal dialog first, and
        # tool_smoke.rb reports no main window for it.
        run: |
          call C:\COSMOS\cosmosenv.bat
          ruby -e "require 'ruby_installer/runtime'; puts 'MSYS2: ' + RubyInstaller::Runtime.msys2_installation.msys_path"
          for /d %%G in (C:\COSMOS\Vendor\Ruby\lib\ruby\gems\2.6.0\gems\cosmos-*) do set "COSMOS_GEM_DIR=%%G"
          call bundle exec ruby "%COSMOS_GEM_DIR%\ext\cosmos\ext\qt6\tool_smoke.rb" cosmos/tools/packet_viewer/packet_viewer Cosmos::PacketViewer 10 || exit /b 1
          call bundle exec ruby "%COSMOS_GEM_DIR%\ext\cosmos\ext\qt6\tool_smoke.rb" cosmos/tools/tlm_grapher/tlm_grapher Cosmos::TlmGrapher 10 || exit /b 1
