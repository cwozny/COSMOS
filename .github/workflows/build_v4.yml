# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will download a prebuilt Ruby version, install dependencies and run tests with Rake
# For more information see: https://github.com/marketplace/actions/setup-ruby-jruby-and-truffleruby

# Reference environment variables: https://docs.github.com/en/actions/reference/environment-variables

name: Cosmos 4 Tests

on:
  push:
    branches: [cosmos4, cosmos4-qt6]
  pull_request:
    branches: [cosmos4, cosmos4-qt6]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ["2.5", "2.6"]
    steps:
      - uses: actions/checkout@v2
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      - name: Run tests
        run: bundle exec rake build spec
        env:
          COSMOS_DEVEL: ${GITHUB_WORKSPACE}\.

  # The Qt6 binding's own suites, on each OS COSMOS runs on. They need Qt 6,
  # which the matrix above does not install, and without this job nothing ever
  # ran test_regressions.rb -- including the scan_unbound ratchet in its
  # section 19. The -latest labels follow whatever versions GitHub moves them to.
  qt6:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      CI: 1
      # A missing Qt6 or moc fails the build instead of stubbing it out.
      COSMOS_QT6_REQUIRED: 1
    steps:
      - uses: actions/checkout@v2
      - name: Install the toolchain and Qt 6 (Windows)
        if: runner.os == 'Windows'
        # One MSYS2 for everything: Qt 6, the compiler that builds against it
        # and the DLLs Ruby loads at run time. MINGW64 is the MSVCRT toolchain
        # RubyInstaller 2.6 is built with, and RubyInstaller adds C:\msys64's
        # mingw64\bin to its DLL search path at startup. This runs before
        # setup-ruby, whose bundle install builds native gems with it.
        run: C:\msys64\usr\bin\pacman.exe -Sy --noconfirm --needed make mingw-w64-x86_64-gcc mingw-w64-x86_64-pkgconf mingw-w64-x86_64-qt6-base
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "2.6"
          bundler-cache: true
          # setup-ruby's own Windows toolchain is a second MSYS2 (GCC 14) in
          # Ruby's directory, which RubyInstaller would find first.
          windows-toolchain: ${{ runner.os == 'Windows' && 'none' || 'default' }}
      - name: Install Qt 6 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev libgl1-mesa-dev
      - name: Install Qt 6 (macOS)
        if: runner.os == 'macOS'
        run: brew install qt
      - name: Build extensions
        run: bundle exec rake build
      - name: Unbound-method ratchet
        run: bundle exec rake qt6_scan_unbound
      - name: Qt6 suites
        run: bundle exec rake qt6_test
