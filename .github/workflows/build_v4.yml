# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will download a prebuilt Ruby version, install dependencies and run tests with Rake
# For more information see: https://github.com/marketplace/actions/setup-ruby-jruby-and-truffleruby

# Reference environment variables: https://docs.github.com/en/actions/reference/environment-variables

name: Cosmos 4 Tests

on:
  push:
    branches: [cosmos4, cosmos4-qt6]
  pull_request:
    branches: [cosmos4, cosmos4-qt6]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # One exact version, the same one the Windows installer installs
        ruby-version: ["4.0.7"]
    steps:
      - uses: actions/checkout@v2
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      - name: Run tests
        run: bundle exec rake build spec
        env:
          COSMOS_DEVEL: ${GITHUB_WORKSPACE}\.

  # The Qt6 binding's own suites, on each OS COSMOS runs on. They need Qt 6,
  # which the matrix above does not install, and without this job nothing ever
  # ran test_regressions.rb -- including the scan_unbound ratchet in its
  # section 19. The -latest labels follow whatever versions GitHub moves them to.
  qt6:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      CI: 1
      # A missing Qt6 or moc fails the build instead of stubbing it out.
      COSMOS_QT6_REQUIRED: 1
    steps:
      - uses: actions/checkout@v2
      - name: Install the toolchain and Qt 6 (Windows)
        if: runner.os == 'Windows'
        # One MSYS2 for everything: Qt 6, the compiler that builds against it
        # and the DLLs Ruby loads at run time. UCRT64 is the toolchain
        # RubyInstaller 4 is built with, and RubyInstaller adds C:\msys64's
        # ucrt64\bin to its DLL search path at startup. This runs before
        # setup-ruby, whose bundle install builds native gems with it.
        run: C:\msys64\usr\bin\pacman.exe -Sy --noconfirm --needed make mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-qt6-base
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.7"
          bundler-cache: true
          # setup-ruby's own Windows toolchain is a second MSYS2 in Ruby's
          # directory, without Qt 6, which RubyInstaller would find first.
          windows-toolchain: ${{ runner.os == 'Windows' && 'none' || 'default' }}
      - name: Show the toolchain (Windows)
        if: runner.os == 'Windows'
        # If qt6.so fails to load, compare the GCC that built Ruby and its
        # bundled runtime DLLs with the one that builds Qt 6 and COSMOS.
        shell: pwsh
        run: |
          ruby -e "puts RUBY_DESCRIPTION; puts RbConfig::CONFIG['CC_VERSION_MESSAGE'].to_s.lines.first"
          C:\msys64\ucrt64\bin\gcc.exe --version | Select-Object -First 1
          Get-ChildItem (Join-Path (Split-Path (Get-Command ruby).Source) 'ruby_builtin_dlls') | ForEach-Object { $_.Name }
      - name: Install Qt 6 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev libgl1-mesa-dev
      - name: Install Qt 6 (macOS)
        if: runner.os == 'macOS'
        run: brew install qt
      - name: Build extensions
        run: bundle exec rake build
      - name: Unbound-method ratchet
        run: bundle exec rake qt6_scan_unbound
      - name: Qt6 suites
        run: bundle exec rake qt6_test

  # DART (lib/cosmos/dart), the Rails application in COSMOS, against PostgreSQL:
  # its specs, then dart_end_to_end.rb, which imports a packet log into the demo
  # project's DART and reads it back through the DART servers.
  dart:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dart
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DART_USERNAME: dart
      DART_DB: dart
      DART_TEST_DB: dart_test
      PGHOST: localhost
      COSMOS_NO_SIMPLECOV: 1
    steps:
      - uses: actions/checkout@v2
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.7"
          bundler-cache: true
      - name: Build extensions
        run: bundle exec rake build
      - name: DART specs
        working-directory: lib/cosmos/dart
        env:
          RAILS_ENV: test
        run: |
          bin/rails db:create db:schema:load
          bundle exec rspec
      - name: DART end to end
        working-directory: demo
        env:
          # The demo has its own Gemfile, which uses the released cosmos gem
          BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
        run: |
          bundle exec rake db:create db:migrate
          # db:migrate dumps db/schema.rb again; it should not change
          git diff --exit-code -- ../lib/cosmos/dart/db/schema.rb
          bundle exec ruby ../.github/scripts/dart_end_to_end.rb
