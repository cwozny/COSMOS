# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will download a prebuilt Ruby version, install dependencies and run tests with Rake
# For more information see: https://github.com/marketplace/actions/setup-ruby-jruby-and-truffleruby

# Reference environment variables: https://docs.github.com/en/actions/reference/environment-variables

name: Cosmos 4 Tests

on:
  push:
    branches: [cosmos4, cosmos4-qt6]
  pull_request:
    branches: [cosmos4, cosmos4-qt6]

jobs:
  test:
    runs-on: ubuntu-18.04
    strategy:
      matrix:
        ruby-version: ["2.5", "2.6"]
    steps:
      - uses: actions/checkout@v2
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      - name: Run tests
        run: bundle exec rake build spec
        env:
          COSMOS_DEVEL: ${GITHUB_WORKSPACE}\.

  # The Qt6 binding's own suites. They need Qt 6 and a display, so they run
  # separately from the matrix above: ubuntu-18.04 has no Qt6 packages, and
  # without this job nothing ever ran test_regressions.rb -- including the
  # scan_unbound ratchet in its section 19.
  qt6:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      CI: 1
      # A missing Qt6 or moc fails the build instead of stubbing it out.
      COSMOS_QT6_REQUIRED: 1
    steps:
      - uses: actions/checkout@v2
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "2.6"
          bundler-cache: true
      - name: Install Qt 6
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev libgl1-mesa-dev
      - name: Build extensions
        run: bundle exec rake build
      - name: Unbound-method ratchet
        run: bundle exec rake qt6_scan_unbound
      - name: Qt6 suites
        run: bundle exec rake qt6_test
